<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1e1b16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Taalmel is a free guitar practice app: songs with tab, a tuner, metronome, recorder and a chord library with practice modes. Optional Google Drive backup and sync." />
    <title>Taalmel</title>
    <script>
      // Set theme and accent before first paint (cached by src/ui/theme.ts).
      (function () {
        var theme = "system", accent = "saffron";
        try {
          var c = JSON.parse(localStorage.getItem("taalmel.theme") || "{}");
          if (c.theme === "dark" || c.theme === "light") theme = c.theme;
          if (c.accent === "teal" || c.accent === "violet") accent = c.accent;
        } catch (e) {}
        if (theme === "system") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        var r = document.documentElement;
        r.setAttribute("data-theme", theme);
        r.setAttribute("data-accent", accent);
        // Installed app: a light status bar with dark text in the light theme (keep in sync with theme.ts).
        if (theme === "light") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f7f4ee");
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", "default");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
